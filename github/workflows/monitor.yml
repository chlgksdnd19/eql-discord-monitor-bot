name: EQL Brand Discord Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 방식
        required: true
        type: choice
        default: monitor
        options:
          - monitor
          - test-webhook
          - reset-baseline
          - inspect-api
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: write

concurrency:
  group: eql-brand-discord-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Node 모듈 설치
        run: npm install --no-audit --no-fund

      - name: 코드 검사
        run: npm run check && npm test

      - name: EQL 브랜드 확인
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
        run: npm run monitor

      - name: API 점검 자료 업로드
        if: ${{ failure() || inputs.mode == 'inspect-api' }}
        uses: actions/upload-artifact@v4
        with:
          name: eql-debug-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 변경된 기준값 저장
        if: ${{ always() && inputs.mode != 'inspect-api' }}
        run: |
          git config user.name "eql-monitor[bot]"
          git config user.email "eql-monitor[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "기준값 변경 없음"
          else
            git commit -m "chore: update EQL monitor state [skip ci]"
            git push
          fi

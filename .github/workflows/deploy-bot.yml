name: Deploy EQL Discord Search Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot-worker

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 모듈 설치
        run: npm install --no-audit --no-fund

      - name: 코드 검사
        run: npm run check && npm test

      - name: Cloudflare Worker 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Worker 비밀 설정
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          STATE_JSON_URL: ${{ secrets.STATE_JSON_URL }}
          ALLOWED_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          ALLOWED_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          node - <<'NODE' > /tmp/eql-worker-secrets.json
          const required = ['DISCORD_PUBLIC_KEY', 'STATE_JSON_URL'];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} GitHub Secret가 필요합니다.`);
          }
          const values = {
            DISCORD_PUBLIC_KEY: process.env.DISCORD_PUBLIC_KEY,
            STATE_JSON_URL: process.env.STATE_JSON_URL,
            ALLOWED_GUILD_ID: process.env.ALLOWED_GUILD_ID || '',
            ALLOWED_CHANNEL_ID: process.env.ALLOWED_CHANNEL_ID || ''
          };
          process.stdout.write(JSON.stringify(values));
          NODE
          npx wrangler secret bulk /tmp/eql-worker-secrets.json
          rm -f /tmp/eql-worker-secrets.json

      - name: Discord 명령어 등록
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: npm run register
